services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - tide-data:/app/data
    restart: unless-stopped

  # The worker: polls the job queue in the shared SQLite file and runs the
  # scanner every SCAN_INTERVAL_MIN minutes (default 30, see
  # src/worker/scan.ts for the credit math), storm sweeps when due, and
  # queued backtests. A second container on the same image and data volume,
  # rather than in-process with the web server, so a slow job can never
  # block a page request. SIGTERM lets the current job finish.
  # In DEMO_MODE the worker has nothing to do and exits cleanly; on-failure
  # keeps it stopped then, instead of restarting it in a loop.
  worker:
    build: .
    command: pnpm worker
    stop_grace_period: 5m
    env_file:
      - .env
    volumes:
      - tide-data:/app/data
    restart: on-failure
    depends_on:
      - app

volumes:
  tide-data:
